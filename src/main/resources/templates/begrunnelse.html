<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilgangsbegrunnelse</title>
    <link href="../public/begrunnelse.css" th:href="@{/pensjon-app-gateway/public/begrunnelse.css}" rel="stylesheet" />
</head>
<body>
<form id="begrunnelseForm">
    <h2>Fyll ut begrunnelse for tilgang</h2>
    <p>
        Du ber om tilgang til et begrenset miljø. Velg en kategori for begrunnelsen og legg eventuelt til en utdypende beskrivelse.
    </p>
    <label for="kategori">Kategori:</label><br>
    <select autofocus id="kategori" name="kategori" required style="width: 100%; max-width: 750px; padding: 8px; box-sizing: border-box;">
        <option value="" disabled selected>-- Velg kategori --</option>
        <option value="1 Feilsøking og analyse">1 - Feilsøking og analyse</option>
        <option value="2 Produksjonsnær kvalitetssikring / generalprøve">2 - Produksjonsnær kvalitetssikring / generalprøve</option>
        <option value="3 Testing av endringer">3 - Testing av endringer</option>
        <option value="4 Prepping og etablering av testdata">4 - Prepping og etablering av testdata</option>
        <option value="5 Integrasjon- og verdikjedetest">5 - Integrasjon- og verdikjedetest</option>
    </select>
    <br><br>

    <label for="begrunnelse">Utdypende begrunnelse (valgfritt):</label><br>
    <input type="text" id="begrunnelse" name="begrunnelse" maxlength="130"
           pattern="[\w\sæøåÆØÅ.,;:!\-?()]{0,130}"
           title="Kun bokstaver, tall, mellomrom og vanlige skilletegn (.,;:!-?). Ingen linjeskift eller spesialtegn."
           style="width: 100%;max-width: 750px; padding: 8px; box-sizing: border-box;">
    <div id="charCount" style="margin-top: 6px;">0 / 130 tegn</div>
    <div id="charWarning" style="color: #c30000; margin-top: 4px; font-size: 0.9em;"></div><br>

    <label for="varighet">Varighet: <span id="varighetValue">1</span> time(r)</label><br>
    <input type="range" id="varighet" name="varighet" min="1" max="8" value="1" step="1" style="width: 100%; max-width: 400px;">
    <br><br>

    <label>
        <input type="checkbox" name="conditions" id="conditions" required>
        <span th:text="${acceptedTerms}">Jeg aksepterer at mine oppslag på personlige opplysninger blir loggført.</span>
    </label>
    <br>
    <button type="submit">Send</button>
</form>
<script>
    // Sanitize input: only allow printable characters safe for HTTP headers
    document.getElementById("begrunnelse").addEventListener("input", function() {
        this.value = this.value.replace(/[^\w\sæøåÆØÅ.,;:!\-?()]/g, '');
        document.getElementById("charCount").textContent = this.value.length + " / " + this.maxLength + " tegn";
        document.getElementById("charWarning").textContent = "";
    });

    // Auto-check the conditions checkbox when a kategori is selected
    document.getElementById("kategori").addEventListener("change", function() {
        if (this.value) {
            document.getElementById("conditions").checked = true;
        }
    });

    // Update slider value display
    document.getElementById("varighet").addEventListener("input", function() {
        document.getElementById("varighetValue").textContent = this.value;
    });

    document.getElementById("begrunnelseForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const begrunnelse = document.getElementById("begrunnelse").value.trim();

        const kategori = document.getElementById("kategori").value;
        if (!kategori) {
            alert("Velg en kategori.");
            document.getElementById("kategori").focus();
            return;
        }

        const varighet = document.getElementById("varighet").value;
        const kategoriUtenNummer = kategori.replace(/^\d+\s+/, '');
        const fullBegrunnelse = begrunnelse ? kategoriUtenNummer + ": " + begrunnelse : kategoriUtenNummer;

        // Send begrunnelse, kategori and varighet to server to store in session
        fetch('/pensjon-app-gateway/begrunnelse', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ begrunnelse: fullBegrunnelse, varighet: parseInt(varighet) })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Redirect to the originally requested page
                const redirectUri = new URLSearchParams(window.location.search).get("redirect_uri");
                const relativeToCurrentOrigin = new URL(redirectUri, window.location.origin);
                window.location.href = relativeToCurrentOrigin.toString();
            } else {
                alert("Det skjedde en feil - klarte ikke å lagre begrunnelse.");
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Det skjedde en feil - klarte ikke å lagre begrunnelse.");
        });
    });
</script>
</body>
</html>
