version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'Europe/Oslo'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: 'Europe/Oslo'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
